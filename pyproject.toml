[project]
name = "embedlab"
version = "0.0.1"
description = "Find out why your retrieval fails."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "polars>=1.18",
    "pyarrow>=18",
    "pydantic>=2.10",
    "pyyaml>=6.0",
]

[project.scripts]
embedlab = "embedlab.cli.main:main"

[project.optional-dependencies]
# Kept out of the core so `uv sync` stays instant and nothing blocks on
# torch/ROCm or compiled extensions. Inference is never on the critical path:
# embeddings are a cached artifact, so a broken GPU backend costs speed, not
# results.
lexical = ["bm25s>=0.2", "pystemmer>=2.2", "scipy>=1.14"]
measures = ["ir-measures>=0.3", "ranx>=0.3.20"]
datasets = ["ir-datasets>=0.5"]
local = ["sentence-transformers>=3.3", "torch>=2.5"]

[dependency-groups]
dev = [
    "basedpyright>=1.23",
    "hypothesis>=6.120",
    "import-linter>=2.1",
    "pytest>=8.3",
    "ruff>=0.8",
    "syrupy>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embedlab"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "UP", "B", "A", "C4", "PT", "SIM",
    "TID", "PTH", "RUF", "ANN", "FBT", "DTZ", "NPY",
]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S101"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.13"

# Standard rather than the stricter defaults. bm25s, scipy and PyStemmer ship no
# type information, so "all" mode spends its entire budget reporting that fact
# back to us. The strictness that pays for itself is applied below, to the layers
# that have no untyped dependencies.
typeCheckingMode = "standard"
reportMissingTypeStubs = false

# The pure core is checked again, strictly, by `typecheck-strict.json`.
# Per-directory `typeCheckingMode` inside executionEnvironments is accepted and
# then ignored by basedpyright, so expressing it here would be a config that
# lies about what it enforces.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: needs model weights on disk"]
filterwarnings = [
    "error",
    # ir_measures parses measure strings with ast.Num, removed in 3.14. Pinned
    # here as a visible reminder that the interpreter upgrade is gated on it.
    "default:ast.Num is deprecated:DeprecationWarning",
    "default:Attribute n is deprecated:DeprecationWarning",
]

[tool.importlinter]
root_packages = ["embedlab"]
include_external_packages = true

# The single architectural law: dependencies point inward, domain depends on
# nothing. This is the whole of what we keep from clean architecture.
[[tool.importlinter.contracts]]
name = "Dependencies point inward"
type = "layers"
layers = [
    "embedlab.cli",
    "embedlab.pipeline",
    # artifacts sits above the pure stages, not below: it serialises what they
    # produce, so it has to know their result types. The first ordering put it
    # underneath and the contract caught it the moment a writer appeared.
    "embedlab.artifacts",
    "embedlab.stages : embedlab.adapters",
    "embedlab.cache",
    "embedlab.domain",
]

[[tool.importlinter.contracts]]
name = "Domain is pure"
type = "forbidden"
source_modules = ["embedlab.domain"]
forbidden_modules = ["polars", "pyarrow", "numpy", "yaml", "pathlib"]
