# What does reordering the candidates buy? A reranker sees candidates and never
# the corpus, so its ceiling is the recall of the list it was handed. Handed
# only the final k it can shuffle what retrieval chose and nothing more, which
# is why `candidates` goes deeper.
name: reranking on SciFact

dataset: datasets/beir-scifact-test
k: 10
measures: [nDCG@10, R@10, RR]

baseline: bm25

systems:
  - name: bm25
    kind: bm25

  # Lexical, no model weights: a different question from BM25, which rewards
  # repeating one rare term and ignores the ones a document never mentions.
  - name: coverage-50
    kind: bm25
    candidates: 50
    reranker: {kind: coverage}

  # The standard second stage: a cross encoder reads query and document
  # together instead of comparing them apart.
  - name: cross-encoder-50
    kind: bm25
    candidates: 50
    reranker:
      kind: cross_encoder
      model_id: cross-encoder/ms-marco-MiniLM-L-6-v2
      device: cpu
      dtype: float32
