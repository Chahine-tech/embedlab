name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # The lexical and measures extras compile pytrec_eval and are needed by
      # most of the suite. The local extra pulls torch and is left out: the
      # tests it unlocks need model weights, and downloading them on every push
      # would cost more than it catches.
      #
      # Type checking therefore runs here and only here, in the environment
      # where the most code resolves. Running it again with fewer extras would
      # report missing modules rather than anything about the code, so the
      # imports that stay unresolved even here (torch, sentence_transformers,
      # huggingface_hub) carry an explicit per-line ignore instead.
      - run: uv sync --extra lexical --extra measures

      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run basedpyright
      - run: uv run basedpyright -p typecheck-strict.json
      - run: uv run lint-imports
      - run: uv run pytest

      # The core must stay installable without any extra, and the suite must
      # skip cleanly rather than fail when one is absent. Tests only: see above
      # for why the type checker does not run a second time here.
      - run: uv sync
      - run: uv run pytest
